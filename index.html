/* Small extensions for the application views. */
.page-heading{font-size:clamp(31px,4vw,42px);letter-spacing:-.045em;margin:4px 0 13px}
.muted-intro{color:var(--sub);line-height:1.6;font-size:15px}
.quiet-btn{background:#e4efec;color:#16545a;border:1px solid #c8ddda;border-radius:12px;padding:10px 14px;font-weight:750}

/* Catch history and community draft screens */
.month-picker{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:18px 0 20px}
.month-picker button{background:white;border:1px solid var(--line);border-radius:12px;padding:13px 4px;text-align:center;font-size:13px;font-weight:750;color:var(--ink)}
.month-picker button small{display:block;color:var(--sub);font-size:11px;font-weight:500;margin-top:3px}
.month-picker button.selected{background:#0b727a;color:#fff;border-color:#0b727a}
.month-picker button.selected small{color:#e1f2f0}
.month-report{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:12px 0;display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr)}
.month-image{border:0;background:#d4e3de;padding:0;height:190px;width:100%;overflow:hidden}
.month-image img{height:100%;width:100%;object-fit:cover}
.month-content{padding:18px}
.month-content h3{margin:0 0 2px;font-size:21px}
.month-content p{margin:7px 0;color:var(--sub);font-size:13px;line-height:1.5}
.month-content .local{font-size:18px;color:var(--aqua);font-weight:750}
.month-content .go-link{margin-top:6px}
.share-form{background:white;border:1px solid var(--line);border-radius:17px;padding:20px;margin:18px 0}
.share-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.share-form .field{margin-bottom:16px;min-width:0}
.share-form input,.share-form select,.share-form textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #cddbd6;background:white;font-size:16px;color:var(--ink)}
.share-form input[type=file]{padding:10px;font-size:13px}
.share-form textarea{min-height:86px;resize:vertical}
.share-form .action{width:100%}
.share-status{padding:10px 13px;border-radius:11px;background:#e9f1ed;font-size:13px;color:#315c62;line-height:1.5}
.draft-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.draft-thumbs img{width:88px;height:88px;object-fit:cover;border-radius:10px;border:1px solid #bcd2cd}
@media(max-width:700px){
.bottom-nav button{min-width:0;flex:1;font-size:10px;gap:3px}
.bottom-nav button span{font-size:21px;line-height:22px}
.month-picker{grid-template-columns:repeat(3,minmax(0,1fr))}
.month-report{grid-template-columns:minmax(0,122px) minmax(0,1fr)}
.month-image{height:190px}
.month-content{padding:13px}
.month-content h3{font-size:17px}
.month-content .local{font-size:16px}
.share-grid{grid-template-columns:1fr}
}


/* Photo slide with reported catch details */
.slide{height:auto;min-height:0;display:flex;flex-direction:column;background:#fff}
.slide-visual{height:340px;flex-shrink:0;position:relative;background:#dae7e2}
.slide-visual img{display:block;width:100%;height:100%;object-fit:contain;background:#153b42}
.slide-visual .placeholder{height:100%}
.slide-visual .attach{bottom:13px}
.slide-caption{background:#fff;padding:16px 18px 18px;flex:1}
.slide-caption-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.slide-caption-name{font-size:19px;font-weight:850;line-height:1.25;color:var(--ink)}
.slide-caption-local{display:block;font-size:18px;font-weight:750;color:var(--aqua)}
.slide-caption-index{border-radius:25px;background:#e8f0ed;font-size:11px;color:#507074;padding:6px 9px;white-space:nowrap}
.slide-caption-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.slide-caption-fields div{border-radius:11px;background:#f0f4f1;padding:10px;font-size:12px;line-height:1.4}
.slide-caption-fields b{display:block;color:#677c7e;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.slide-caption-warning{font-size:11px;color:#75502d;background:#fff5e5;border-radius:9px;margin-top:10px;padding:9px 10px;line-height:1.5}
@media(max-width:700px){.slide-visual{height:305px}.slide-caption{padding:14px}.slide-caption-fields{gap:7px}}
@media(max-width:380px){.slide-visual{height:245px}}

/* Category-first homepage */
.categories-hero{padding:27px 25px}
.categories-hero h1{font-size:clamp(30px,5vw,46px)}
.category-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0 23px}
.category-actions .action{width:100%;text-align:center}
.category-title-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:15px 0}
.category-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.category-tile{width:100%;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:17px;overflow:hidden;display:grid;grid-template-columns:112px minmax(0,1fr) 15px;align-items:stretch;text-align:left;padding:0;min-height:132px}
.category-tile:hover{border-color:#65a0a1;box-shadow:0 3px 12px #173d4017}
.category-tile-photo{min-height:132px;background:#dce8e4;overflow:hidden}
.category-tile-photo img{display:block;width:100%;height:100%;object-fit:cover}
.category-tile-placeholder{display:flex;align-items:center;justify-content:center;height:100%;width:100%;color:#5f8081;font-size:35px;background:linear-gradient(135deg,#d4e4df,#eff2eb)}
.category-tile-body{display:flex;flex-direction:column;justify-content:center;padding:13px 6px 13px 15px;min-width:0}
.category-tile-body strong{font-size:15px;line-height:1.35;font-weight:800}
.category-tile-desc{font-size:12px;line-height:1.5;color:var(--sub);margin-top:6px}
.category-tile-arrow{align-self:center;color:var(--aqua);font-size:24px;padding-right:12px}
@media(max-width:780px){.category-tiles{grid-template-columns:1fr}.category-tile{grid-template-columns:115px minmax(0,1fr) 18px}.category-actions{grid-template-columns:1fr}}
@media(max-width:380px){.category-tile{grid-template-columns:94px minmax(0,1fr) 16px;min-height:116px}.category-tile-photo{min-height:116px}}


/* Species ID and catch gallery are separate screens */
.id-profile{max-width:1050px;margin:18px auto 0;display:grid;grid-template-columns:minmax(0,0.85fr) minmax(0,1.15fr);gap:21px;align-items:start}
.id-photo-section{min-width:0}
.id-photo-frame{background:#e5eeea;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;align-items:center;justify-content:center;min-height:280px}
.id-photo-frame img{display:block;width:100%;height:auto;max-height:355px;object-fit:contain;border-radius:11px;background:#e5eeea}
.id-photo-frame .placeholder{min-height:235px;border-radius:11px}
.id-photo-note{padding:11px 5px 6px;line-height:1.55}
.id-info-stack{min-width:0}
.id-info-stack .info-card{margin-bottom:13px}
.id-gallery-link{width:100%;margin:10px 0 17px}
.catches-gallery{max-width:740px;margin:19px auto}
.catches-gallery .slide-visual{height:440px}
.catches-gallery .slide-visual img{object-fit:contain}
.gallery-catch-note{font-size:13px;color:#536d70;line-height:1.5;margin:12px 0 0}
@media(max-width:700px){
 .id-profile{grid-template-columns:1fr;gap:10px;margin-top:15px}
 .id-photo-frame{min-height:0;padding:12px}
 .id-photo-frame img{max-height:280px}
 .id-gallery-link{margin:8px 0 12px}
 .catches-gallery .slide-visual{height:355px}
}
@media(max-width:380px){.id-photo-frame img{max-height:245px}.catches-gallery .slide-visual{height:300px}}


/* Expand a category's species list on the home screen instead of creating a separate page */
.category-entry{min-width:0}
.category-expanded{background:#f8faf7;border:1px solid #ceded7;border-top:none;border-radius:0 0 15px 15px;padding:7px 10px 10px;margin-top:-9px}
.category-entry:has(.category-expanded)>.category-tile{border-radius:17px 17px 0 0}
.category-species{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #dce7e1;border-radius:11px;padding:8px 11px;width:100%;margin-top:7px;text-align:left;color:var(--ink)}
.category-species-image{width:64px;height:64px;flex-shrink:0;display:grid;place-items:center;background:#e4ede8;border-radius:8px;overflow:hidden}
.category-species-image img{width:100%;height:100%;object-fit:cover}
.category-species-name{display:flex;flex:1;flex-direction:column;gap:4px;min-width:0}
.category-species-name strong{font-size:14px;line-height:1.3}
.category-species-name small{font-size:13px;color:var(--aqua);line-height:1.3}
.category-empty{margin:12px 5px;font-size:13px;color:var(--sub)}


/* Species choices get a dedicated page, not an expansion on the homepage. */
.subcategory-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin:22px 0}
.subcategory-fish{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:17px;padding:0;overflow:hidden;min-height:168px;text-align:left;color:var(--ink)}
.subcategory-fish:hover{border-color:#6ca1a0;box-shadow:0 4px 15px #173d4017}
.subcategory-photo{width:148px;min-width:148px;align-self:stretch;display:grid;place-items:center;background:#e1ece7}
.subcategory-photo img{width:100%;height:100%;object-fit:contain}
.subcategory-placeholder{font-size:32px;color:#698683}
.subcategory-text{padding:15px;display:flex;flex:1;flex-direction:column;gap:5px;min-width:0}
.subcategory-text strong{font-size:19px;line-height:1.24}
.subcategory-text small{font-size:17px;font-weight:700;color:var(--aqua)}

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function reportedMonth(item){return MONTHS.findIndex(m=>(item.catchDate||'').startsWith(m))+1}
function reportsForFish(fish){
 if(fish.catchSlides?.length){
  return fish.catchSlides.map((slide,index)=>({fish,photoIndex:index,catchDate:slide.date,method:slide.method,catchWeight:slide.weight||null,lure:slide.lure||null,dateNote:slide.dateNote||null}));
 }
 return [{fish,photoIndex:0,catchDate:fish.catchDate,dateNote:fish.dateNote,method:fish.method,lure:fish.lure,catchWeight:fish.catchWeight||null}];
}
function allCatchReports(){return FISH.flatMap(reportsForFish)}

const COMMUNITY_DRAFT_KEY='punta-chivato-community-draft-v1';

let localDraftPhotoURLs=[];
function clearDraftPhotoURLs(){for(const u of localDraftPhotoURLs)URL.revokeObjectURL(u);localDraftPhotoURLs=[]}
async function refreshDraftPhotoThumbs(){

 const db=await openDB();

}

const app=document.getElementById('app');
const state={view:'explore',month:'all',id:null,category:null,search:'',openWater:false,appearance:{shape:'',color:'',marking:'',tail:''},imageUrls:new Map(),idImageUrls:new Map(),categoryImageUrls:new Map(),livePhotoSlots:new Set(),currentPhoto:0};
let dbPromise;
const reqStore='fish-photos-v1';
function openDB(){
 if(!('indexedDB' in window)) return Promise.resolve(null);
 if(!dbPromise) dbPromise=new Promise(resolve=>{
  try{const request=indexedDB.open('punta-chivato-fish-id',1);
   request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains(reqStore))request.result.createObjectStore(reqStore)};
   request.onsuccess=()=>resolve(request.result);request.onerror=()=>resolve(null);
  }catch(_){resolve(null)}
 });
 return dbPromise;
}
async function readPhoto(key){const db=await openDB();if(!db)return null;return new Promise(resolve=>{try{const t=db.transaction(reqStore,'readonly'),r=t.objectStore(reqStore).get(key);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>resolve(null)}catch(_){resolve(null)}})}
async function savePhoto(key,blob){const db=await openDB();if(!db)return false;return new Promise(resolve=>{try{const t=db.transaction(reqStore,'readwrite');t.objectStore(reqStore).put(blob,key);t.oncomplete=()=>resolve(true);t.onerror=()=>resolve(false)}catch(_){resolve(false)}})}
async function preloadPhotos(){
 for(const [category,path] of Object.entries(CATEGORY_PHOTOS)){
  if(await bundledExists(path))state.categoryImageUrls.set(category,path);
 }
 for(const fish of FISH){
  // Identification photos are species-guide assets, independent from catch-gallery photos.
  if(fish.idPhoto && await bundledExists(fish.idPhoto))state.idImageUrls.set(fish.id,fish.idPhoto);
  for(let n=0;n<fish.shots;n++){
   const key=`${fish.id}-${n}`;
   const blob=await readPhoto(key);
   if(blob){state.imageUrls.set(key,URL.createObjectURL(blob));state.livePhotoSlots.add(key)}
   else if(fish.localPhotos[n] && await bundledExists(fish.localPhotos[n]))state.imageUrls.set(key,fish.localPhotos[n]);
  }
 }
 render();
}
async function bundledExists(url){try{const response=await fetch(url,{method:'HEAD'});return response.ok&&response.headers.get('content-type')?.startsWith('image/')}catch(_){return false}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function keyFor(fish,index){return `${fish.id}-${index}`}
function fishPhoto(fish,index=0){return state.imageUrls.get(keyFor(fish,index))||null}
function identificationPhoto(fish){return state.idImageUrls.get(fish.id)||fishPhoto(fish,0)||null}
function imageArea(fish,index,opts={}){
 const src=opts.kind==='identification'?identificationPhoto(fish):fishPhoto(fish,index);const text=opts.kind==='identification'?'Identification photo':fish.shots>1?`Photo ${index+1} of ${fish.shots}`:'Catch photo';

 `<div class="placeholder"><span class="camera" aria-hidden="true">▧</span><strong>${esc(text)} not added yet</strong><small>Use your original photo — no stock images</small></div>`;
}
function card(fish){
 const got=Array.from({length:fish.shots},(_,n)=>fishPhoto(fish,n)).filter(Boolean).length;
 return `<article class="fish-card"><button class="card-photo" type="button" data-fish="${fish.id}" aria-label="View ${esc(fish.english)} details">
 ${imageArea(fish,0,{kind:'identification'})}</button>
 <div class="card-content"><h3 class="fish-title">${esc(fish.english)}</h3><p class="fish-spanish">${esc(fish.spanish)}</p>

 <div class="card-bottom"><button class="go-link" type="button" data-fish="${fish.id}">View fish details →</button><span class="photo-count">${got} / ${fish.shots} photos</span></div></div></article>`
}
function footer(){return `<footer class="footnote">Punta Chivato Fish ID · Sea of Cortez</footer>`}
function home(){

 if(state.category)matches=matches.filter(f=>f.category===state.category);
 if(state.openWater)matches=matches.filter(f=>f.openWater);
 const title=state.category||'Your fish guide';
 return `${!state.category?`<section class="hero"><span class="eyebrow">Your local guide · Version 1</span><h1>Know your fish.<br><em>Conoce tu pesca.</em></h1><p>Real catch photos, English and local names, and a quick way to narrow down a fish by its appearance.</p><div class="hero-foot"><span class="hero-chip">4 fish records</span><span class="hero-chip">4 photo slots</span><span class="hero-chip">8 categories</span></div></section>`:`<button class="back" data-nav="groups" type="button">← All categories</button><h1 class="page-heading">${esc(state.category)}</h1>`}
 <div class="searchrow"><label class="search-box"><span aria-hidden="true">⌕</span><input id="fishSearch" type="search" placeholder="Search cabrilla, dorado, dolphinfish…" value="${esc(state.search)}" aria-label="Search fish in English, Spanish or alternate names"></label><button type="button" class="action" data-nav="appearance">Not sure? Find by appearance</button></div>
 ${!state.category?`<section class="leadpanel"><h2>Not sure what you caught?</h2><p>Choose a body shape, color, markings, or tail shape. Get suggestions from the fish already in your guide — not a definitive identification.</p><button type="button" class="action alt" data-nav="appearance">Find by appearance →</button></section>`:''}
 <div class="filterrow"><h2 class="sectiontitle">${esc(title)} <span class="hint">(${matches.length})</span></h2><label class="check"><input id="openWater" type="checkbox" ${state.openWater?'checked':''}> Open-water fish only</label></div>
 ${matches.length?`<section class="cards">${matches.map(card).join('')}</section>`:`<div class="empty"><h3>${state.category&&!q&&!state.openWater?'Photos haven’t been added yet':'No matching fish yet'}</h3><p>${state.category&&!q&&!state.openWater?'This category is ready for photos and confirmed catches.':'Try another name, turn off the open-water filter, or browse the categories.'}</p>${state.category?'<button class="action alt" data-nav="groups" type="button">See all categories</button>':''}</div>`}
 ${footer()}`;
}

 return `<section class="finder-header"><span class="eyebrow">Reported catch history</span><h1>What was caught by month?</h1><p>Browse catch reports and how the fish were caught. These are fish catches submitted to the guide.</p></section>

 ${MONTHS.map((name,i)=>{const count=reports.filter(r=>reportedMonth(r)===i+1).length;return `<button type="button" data-month="${i+1}" class="${chosen===String(i+1)?'selected':''}">${name.slice(0,3)}<small>${count?count+' report'+(count===1?'':'s'):'No reports'}</small></button>`}).join('')}</div>
 <h2 class="sectiontitle">${title} <span class="hint">(${selected.length} reported catch record${selected.length===1?'':'s'})</span></h2>

 <div class="month-content"><h3>${esc(r.fish.english)}</h3><div class="local">${esc(r.fish.spanish)}</div>

 <p class="note">Records count distinct reported catches, not photographs, trips, or anglers. Two Dorado catches on June 20 and June 21 are separately recorded. Fishing methods are shown as reported. ${undated.length?`${undated.length} undated record(s) are excluded from monthly counts.`:''}</p>
 <button type="button" class="action" data-nav="share">Share a catch (private draft) →</button>${footer()}`;
}

 color:[['','Any color'],['brown','Brown / gray-brown'],['silver','Silver'],['bright','Bright green / blue / gold'],['orange','Orange / reddish']],

function appearance(){
 const labels={shape:'Body shape',color:'Color',marking:'Markings',tail:'Tail shape'};
 const choices=Object.keys(CHOICES).map(k=>`<label class="field">${labels[k]}<select data-appearance="${k}">${CHOICES[k].map(([v,n])=>`<option value="${esc(v)}" ${state.appearance[k]===v?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`).join('');
 const selected=Object.entries(state.appearance).filter(([k,v])=>v);
 let ranked=FISH.map(f=>({fish:f,score:selected.reduce((n,[k,v])=>n+(f[k]===v?1:0),0)}));
 ranked=selected.length?ranked.filter(x=>x.score>0).sort((a,b)=>b.score-a.score):ranked;
 const perfect=ranked.filter(x=>x.score===selected.length);
 return `<button type="button" class="back" data-nav="explore">← Explore fish</button><section class="finder-header"><span class="eyebrow">Visual fish finder</span><h1>Find by appearance</h1><p>Start with what you can see. Choose one or more details. Results compare the fish currently in this guide.</p></section>

 ${ranked.length?ranked.map(item=>`<button class="result-item" type="button" data-fish="${item.fish.id}"><div><strong>${esc(item.fish.english)} — ${esc(item.fish.spanish)}</strong><small>${esc(item.fish.category)}</small></div><b>${selected.length?`${item.score}/${selected.length} features`:'View ›'}</b></button>`).join(''):`<div class="empty"><h3>No appearance matches</h3><p>Try fewer features or browse the categories.</p></div>`}

function render(){
 app.innerHTML=state.view==='detail'?detail(FISH.find(f=>f.id===state.id)||FISH[0]):state.view==='catches'?catchGallery(FISH.find(f=>f.id===state.id)||FISH[0]):state.view==='appearance'?appearance():state.view==='groups'?groups():state.view==='category'?categoryPage(state.category):state.view==='months'?monthsPage():state.view==='share'?sharePage():home();
 document.querySelectorAll('[data-nav]').forEach(b=>{b.classList.toggle('active',b.dataset.nav===state.view||((state.view==='detail'||state.view==='catches'||state.view==='category')&&b.dataset.nav==='groups')||(state.view==='explore'&&!!state.category&&b.dataset.nav==='groups'))});
 if(state.view==='catches')setupGallery();
 if(state.view==='share')refreshDraftPhotoThumbs();
}
function route(view,id=null,category=null,keepSearch=false){
 state.view=view;state.id=id;state.category=category;state.currentPhoto=0;
 if(!keepSearch)state.search='';state.openWater=false;
 const hash=view==='detail'?`#fish/${id}`:view==='catches'?`#catches/${id}`:view==='category'&&category?`#category/${encodeURIComponent(category)}`:view==='explore'&&category?`#category/${encodeURIComponent(category)}`:`#${view}`;
 if(location.hash!==hash)history.pushState(null,'',hash);
 render();window.scrollTo(0,0);
}
function fromHash(){
 const hash=decodeURIComponent(location.hash.replace(/^#/,''));
 if(hash.startsWith('catches/')&&FISH.some(x=>x.id===hash.slice(8))){state.view='catches';state.id=hash.slice(8);state.category=null}
 else if(hash.startsWith('fish/')&&FISH.some(x=>x.id===hash.slice(5))){state.view='detail';state.id=hash.slice(5);state.category=null}
 else if(hash.startsWith('category/')&&CATEGORIES.includes(hash.slice(9))){
  const category=hash.slice(9),fishInCategory=FISH.filter(f=>f.category===category);
  if(fishInCategory.length===1){state.view='detail';state.id=fishInCategory[0].id;state.category=null;history.replaceState(null,'',`#fish/${fishInCategory[0].id}`)}
  else{state.view='category';state.category=category;state.id=null}
 }
 else if(['appearance','groups','months','share','explore'].includes(hash)){state.view=hash;state.id=null;state.category=null}
 else{state.view='groups';state.id=null;state.category=null}
 state.currentPhoto=0;render();
}
function setupGallery(){const track=document.getElementById('galleryTrack');if(!track)return;
 const update=()=>{state.currentPhoto=Math.min(track.children.length-1,Math.max(0,Math.round(track.scrollLeft/Math.max(1,track.clientWidth))));
  document.querySelectorAll('#galleryDots .dot').forEach((d,i)=>d.classList.toggle('active',i===state.currentPhoto))};
 track.addEventListener('scroll',update,{passive:true});
}
function moveSlide(direction){const track=document.getElementById('galleryTrack');if(!track)return;
 const count=track.children.length;state.currentPhoto=Math.min(count-1,Math.max(0,state.currentPhoto+(direction==='next'?1:-1)));
 track.scrollTo({left:track.clientWidth*state.currentPhoto,behavior:'smooth'});
 document.querySelectorAll('#galleryDots .dot').forEach((d,i)=>d.classList.toggle('active',i===state.currentPhoto));
}
let uploadTarget=null;
document.addEventListener('click',e=>{
 const catchBtn=e.target.closest('[data-catches]');if(catchBtn){route('catches',catchBtn.dataset.catches);return}
 const fishBtn=e.target.closest('[data-fish]');if(fishBtn){route('detail',fishBtn.dataset.fish);return}
 const cat=e.target.closest('[data-category]');if(cat){
  const name=cat.dataset.category,fishInCategory=FISH.filter(f=>f.category===name);
  if(fishInCategory.length===1){route('detail',fishInCategory[0].id);return}
  route('category',null,name);
  return
 }
 const month=e.target.closest('[data-month]');if(month){state.month=month.dataset.month;render();return}
 const nav=e.target.closest('[data-nav]');if(nav){route(nav.dataset.nav);return}
 const slide=e.target.closest('[data-slide]');if(slide){moveSlide(slide.dataset.slide);return}
 const photo=e.target.closest('[data-photo]');if(photo){uploadTarget={id:photo.dataset.photo,slot:Number(photo.dataset.slot)};const input=document.getElementById('photoInput');input.value='';input.click();return}
 if(e.target.closest('#clearAppearance')){state.appearance={shape:'',color:'',marking:'',tail:''};render()}
});
document.addEventListener('input',e=>{
 if(e.target.id==='fishSearch'){
  const el=e.target;state.search=el.value;
  // Only refresh results, preserving the active input so typing works smoothly.
  const q=norm(state.search);let fish=FISH.filter(f=>(!q||norm([f.english,f.spanish,f.scientific,...f.other].join(' ')).includes(q))&&(!state.category||f.category===state.category)&&(!state.openWater||f.openWater));
  const cards=document.querySelector('.cards');const empty=document.querySelector('.empty');
  const content=fish.length?`<section class="cards">${fish.map(card).join('')}</section>`:`<div class="empty"><h3>No matching fish yet</h3><p>Try another name, or turn off the open-water filter.</p></div>`;
  (cards||empty)?.insertAdjacentHTML('afterend',content);(cards||empty)?.remove();
  const count=document.querySelector('.filterrow .hint');if(count)count.textContent=`(${fish.length})`;
 }
 if(e.target.id==='openWater'){state.openWater=e.target.checked;render();const input=document.getElementById('fishSearch');if(input&&state.search)input.focus()}
});
document.addEventListener('change',e=>{const k=e.target.dataset.appearance;if(k){state.appearance[k]=e.target.value;render()}});
document.getElementById('photoInput').addEventListener('change',async e=>{
 const file=e.target.files?.[0];if(!file||!uploadTarget)return;
 if(!file.type.startsWith('image/')){alert('Please choose an image file.');return}
 if(file.size>30*1024*1024){alert('Please use a photo under 30 MB.');return}
 const key=`${uploadTarget.id}-${uploadTarget.slot}`;
 const saved=await savePhoto(key,file);
 const prev=state.imageUrls.get(key);if(prev?.startsWith('blob:'))URL.revokeObjectURL(prev);
 state.imageUrls.set(key,URL.createObjectURL(file));state.livePhotoSlots.add(key);
 render();
 alert(saved?'Photo added on this device. To make it visible on the published website, it still needs to be added to the app files.':'Photo displayed for this session only; persistent storage is unavailable in this browser. It still must be published separately.');
});

async function prepareCatchFile(file){
 const url=URL.createObjectURL(file);
 try{
  const img=await new Promise((resolve,reject)=>{
   const picture=new Image();
   picture.onload=()=>resolve(picture);
   picture.onerror=()=>reject(new Error('Cannot open the selected photo'));
   picture.src=url;
  });
  const ratio=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight));
  const canvas=document.createElement('canvas');
  canvas.width=Math.round(img.naturalWidth*ratio)||1;
  canvas.height=Math.round(img.naturalHeight*ratio)||1;
  canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.7));
  if(!blob)throw new Error('Photo resizing failed');
  return new File([blob],'catch-photo.jpg',{type:'image/jpeg'});
 }finally{URL.revokeObjectURL(url)}
}
document.addEventListener('submit',async e=>{
 if(e.target.id!=='communityDraftForm')return;
 if(e.target.dataset.publicUpload==='yes'){
  e.preventDefault();
  const form=e.target,input=form.querySelector('#communityPhotoInput');
  const photos=Array.from(input.files||[]);
  const status=document.getElementById('draftStatus'),button=form.querySelector('button[type=submit]');
  if(button.disabled||!form.reportValidity())return;
  if(photos.length<1||photos.length>5){status.textContent='Please choose one to five photos.';status.scrollIntoView({block:'center'});return}
  button.disabled=true;
  try{
   const batch=new DataTransfer();
   for(let i=0;i<photos.length;i++){
    status.textContent='Resizing photo '+(i+1)+' of '+photos.length+'…';
    batch.items.add(await prepareCatchFile(photos[i]));
   }
   input.files=batch.files;
   status.textContent='Sending your catch for review…';
   form.submit();
  }catch(error){
   status.textContent='Could not prepare the photo: '+(error.message||'Please try again.');
   status.scrollIntoView({block:'center'});
   button.disabled=false;
  }
  return;
 }
 e.preventDefault();
 const f=e.target;
 const status=document.getElementById('draftStatus');
 if(!f.reportValidity())return;
 if(!f.elements.agreeRules.checked){
  if(status)status.textContent='You must agree to both photo rules before saving your catch.';
  return;
 }
 const date=f.elements.date.value;
 const localToday=new Date();
 const todayString=[localToday.getFullYear(),String(localToday.getMonth()+1).padStart(2,'0'),String(localToday.getDate()).padStart(2,'0')].join('-');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date<'2026-01-01'||date>todayString){
  if(status)status.textContent='Catch date must be January 1, 2026 or later and cannot be in the future.';
  return;
 }
 const prior=readCommunityDraft();
 const photoCount=Math.min(5,Number(prior.photoCount)||0);
 if(photoCount<1){
  if(status)status.textContent='Please choose at least one catch photo before saving.';
  return;
 }
 const d=Object.fromEntries(new FormData(f).entries());
 delete d.agreeRules;
 delete d.files;
 d.photoCount=photoCount;
 d.rulesVersion='2026-local-area-v1';
 const ok=writeCommunityDraft(d);
 if(status)status.textContent=ok?'Private catch draft saved with '+photoCount+' photo(s) on this device. Nothing was uploaded publicly.':'This browser could not save the catch draft. Nothing was uploaded.';
});
document.addEventListener('change',e=>{
 if(e.target.id!=='communityPhotoInput')return;
 const files=Array.from(e.target.files||[]);
 const status=document.getElementById('draftStatus');
 const preview=document.getElementById('draftPhotoPreview');
 clearDraftPhotoURLs();
 if(files.length>5){e.target.value='';if(status)status.textContent='Choose no more than five photos.';return}
 localDraftPhotoURLs=files.map(file=>URL.createObjectURL(file));
 if(preview)preview.innerHTML=files.length?'<div class="draft-thumbs">'+localDraftPhotoURLs.map((url,i)=>'<img src="'+esc(url)+'" alt="Selected catch photo '+(i+1)+'">').join('')+'</div>':'<p class="hint">No photos selected yet.</p>';
 if(status)status.textContent=files.length?files.length+' photo(s) selected. Tap Submit your catch for review to send them.':'Please choose at least one photo.';
});
